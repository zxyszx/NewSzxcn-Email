services:
  lanqin-email:
    image: ${LANQIN_IMAGE:-ghcr.io/zxyszx/newszxcn-email:latest}
    env_file: .env
    environment:
      LANQIN_UPDATE_SERVICE_URL: http://updater:8080/v1/update
      LANQIN_UPDATE_SERVICE_TOKEN: ${LANQIN_UPDATE_TOKEN:-}
      LANQIN_BACKUP_SOURCE_DIR: /backup-source
      LANQIN_BACKUP_DIR: /backups
    ports:
      - "${LANQIN_HTTP_BIND:-80}:80"
      - "${LANQIN_SMTP_BIND:-25}:25"
      - "${LANQIN_SMTPS_BIND:-465}:465"
      - "${LANQIN_SUBMISSION_BIND:-587}:587"
      - "${LANQIN_IMAPS_BIND:-993}:993"
      - "${LANQIN_POP3S_BIND:-995}:995"
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      - ./dkim:/var/lib/rspamd/dkim
      - ./certs:/certs:ro
      - ./.env:/backup-source/.env:ro
      - ./docker-compose.yml:/backup-source/docker-compose.yml:ro
      - ./backups:/backups
    labels:
      com.newszxcn.email.component: "mail"
    restart: unless-stopped

  updater:
    image: ${LANQIN_UPDATER_IMAGE:-ghcr.io/zxyszx/newszxcn-email:updater-latest}
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${LANQIN_UPDATE_TOKEN:?请在 .env 设置 LANQIN_UPDATE_TOKEN}
      LANQIN_INSTALL_DIR: ${LANQIN_INSTALL_DIR:-/opt/newszxcn-email}
      LANQIN_TARGET_IMAGE: ${LANQIN_IMAGE:-ghcr.io/zxyszx/newszxcn-email:latest}
      LANQIN_UPDATE_HEALTH_URL: http://lanqin-email/healthz
      LANQIN_UPDATE_HEALTH_SECONDS: ${LANQIN_UPDATE_HEALTH_SECONDS:-90}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LANQIN_INSTALL_DIR:-/opt/newszxcn-email}:${LANQIN_INSTALL_DIR:-/opt/newszxcn-email}
    labels:
      com.newszxcn.email.component: "updater"
    restart: unless-stopped
